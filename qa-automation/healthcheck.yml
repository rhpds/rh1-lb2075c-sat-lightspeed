---
# HEALTHCHECK — Environment readiness for event use (Satellite Lightspeed lab)
# Verifies satellite host is reachable, services are running, Lightspeed is
# NOT yet installed (clean starting state), and RHEL hosts are up.
#
# Non-destructive: does not modify any lab state.
# Should complete in under 60 seconds.
#
# Env vars injected by ZT runner (Kubernetes service discovery):
#   SATELLITE_SSH_SERVICE_HOST, SATELLITE_SSH_SERVICE_PORT
#   ANSIBLE_USER, ANSIBLE_PASSWORD
#
# Exit 0 = healthy, non-zero = unhealthy.

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add satellite host
      ansible.builtin.add_host:
        name: satellite
        ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'SATELLITE_SSH_SERVICE_HOST') }}"
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'SATELLITE_SSH_SERVICE_PORT') | default('22', true) }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PASSWORD') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        groups: satellite

- name: Healthcheck - Satellite host
  hosts: satellite
  gather_facts: false
  become: true
  tasks:
    - name: Verify SSH connectivity
      ansible.builtin.ping:

    - name: Verify Satellite services are running
      ansible.builtin.command:
        cmd: hammer ping
      changed_when: false

    - name: Verify Satellite Web UI is responding
      ansible.builtin.uri:
        url: https://localhost/users/login
        validate_certs: false
        status_code: [200, 302]
      changed_when: false

    - name: Verify rhel1 is reachable from satellite
      ansible.builtin.command: ping -c 1 -W 5 rhel1
      changed_when: false

    - name: Verify rhel2 is reachable from satellite
      ansible.builtin.command: ping -c 1 -W 5 rhel2
      changed_when: false

    - name: Check iop containers are absent (Lightspeed not pre-installed)
      ansible.builtin.shell:
        cmd: podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qi iop
      register: _iop_check
      changed_when: false
      failed_when: _iop_check.rc == 0

    - name: Check egress to security.access.redhat.com (warning only)
      ansible.builtin.uri:
        url: https://security.access.redhat.com
        method: HEAD
        status_code: [200, 301, 302, 403]
        timeout: 15
      register: _egress_check
      ignore_errors: true

    - name: Warn if egress is unavailable
      ansible.builtin.debug:
        msg: "WARNING: No egress to security.access.redhat.com — Module 3 cvemap.xml download will fail unless pre-staged"
      when: _egress_check is failed
