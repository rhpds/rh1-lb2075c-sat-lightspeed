project:
  slug: "rh1-lb2075c-sat-lightspeed"
  owner_email: "psrivast@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "A hands-on lab that walks through installing Red Hat Lightspeed on a Satellite server, staging CVE metadata, and using Lightspeed to detect and display host vulnerabilities."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1529"
  workflow_id: "0123522c-4591-417c-9ab4-a991cfbf8990"

spec:
  title: "Installing Red Hat Lightspeed on Red Hat Satellite"
  learning_objectives:
    - "Install Red Hat Lightspeed on a Satellite server using the satellite-installer command"
    - "Configure the CVE metadata database by downloading and staging cvemap.xml in the Foreman data directory"
    - "Register RHEL 10 hosts with Red Hat Insights using the insights-client"
    - "Verify that Red Hat Lightspeed detects and displays host vulnerabilities in the Satellite web UI"
  modules:
    - id: module-01
      title: "Introduction"
      duration_min: 10
      status: in_progress
    - id: module-02
      title: "Install Red Hat Lightspeed"
      duration_min: 25
      status: in_progress
    - id: module-03
      title: "Configure CVE Data and Verify Lightspeed"
      duration_min: 20
      status: in_progress
  environment:
    platform: "rhel-vms"           # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"        # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv            # cnv | aws — cnv is default
    max_concurrent_users: null     # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: satellite.lab
        count: 1
        cpu: 8
        ram_gb: 32
        disk_gb: 540
        os: RHEL (satellite-server image)
      - role: rhel1.lab
        count: 1
        cpu: 1
        ram_gb: 4
        disk_gb: 40
        os: RHEL 10
      - role: rhel2.lab
        count: 1
        cpu: 1
        ram_gb: 4
        disk_gb: 40
        os: RHEL 10

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:
      - security.access.redhat.com     # CVE metadata download during lab
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1
  audience: "beginner"       # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: in_progress
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: null
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "This lab teaches beginners how to install and configure Red Hat Lightspeed on a pre-installed Satellite server. Participants run the satellite-installer command to enable Lightspeed, stage the CVE metadata database, register RHEL 10 hosts with Insights, and confirm vulnerability detection in the Satellite web UI. The lab runs approximately one hour across three progressive modules."
    module_summaries:
      - "module-01: Introduces the lab goal and the three-node environment; walks participants through logging into the Satellite web UI using provided credentials."
      - "module-02: Explains what Red Hat Lightspeed is and guides participants through running satellite-installer --enable-iop to install it, then verifying the Lightspeed menu appears in the Satellite web UI."
      - "module-03: Walks participants through downloading cvemap.xml and staging it in the Foreman data directory, registering both RHEL 10 hosts with insights-client, and confirming vulnerabilities appear in the Lightspeed Vulnerability tab."
    rcars_overlap_pct: 98
    rcars_top_matches:
      - title: "Hands on with Red Hat Lightspeed in Satellite"
        ci_name: "zt-rhelbu.zt-lightspeed-satellite.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-lightspeed-satellite.prod"
        relevance_score: 98
        why_it_fits: "Directly covers Red Hat Lightspeed in Red Hat Satellite, CVE metadata and vulnerability management, and RHEL host registration with Insights — closely matching all core topics."
        workloads: []
      - title: "Satellite Basics"
        ci_name: "zt-rhelbu.zt-satellite-basics.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-satellite-basics.prod"
        relevance_score: 71
        why_it_fits: "Covers Red Hat Satellite 6.19 with Lightspeed integration, CVE vulnerability management, and Insights host registration — a broader Satellite lab that includes Lightspeed as one module."
        workloads: []
      - title: "Remediating vulnerabilities with Red Hat Insights Vulnerability"
        ci_name: "zt-rhelbu.zt-insights-vulnerability.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-rhelbu.zt-insights-vulnerability.prod"
        relevance_score: 64
        why_it_fits: "Covers Insights Vulnerability management, CVE identification, and RHEL registration — overlaps with the Insights/CVE portion but focuses on Hybrid Cloud Console, not Satellite or Lightspeed."
        workloads: []
    catalog_gap: "This lab uniquely focuses on the step-by-step satellite-installer workflow to enable Lightspeed — a discrete installation exercise not confirmed present in the catalog's existing Lightspeed labs. It is scoped as a short standalone (55 min) for audiences with no prior Satellite experience, whereas the closest match (zt-lightspeed-satellite) runs 90 minutes and uses an Infinicorp scenario that assumes broader Satellite familiarity."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
